<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101614" />
    <meta name="description" content="Grow and evolve plants with editable Blockly rules." />
    <title>Canopy — Plant playground</title>
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 31V17m0 8-8-8m8 4 8-8m-8 4 4-5m-12 5v-5m16 1h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="17" r="1.6" fill="currentColor"/></svg>
          <div>
            <div class="brand-name">Canopy</div>
            <h1>Plant playground</h1>
          </div>
        </div>
        <div class="library-tools">
          <button id="my-trees" class="button" type="button" aria-haspopup="dialog">My trees</button>
          <button id="save-tree" class="button primary" type="button" aria-haspopup="dialog">Save tree</button>
        </div>
      </header>

      <div class="toolbar" role="group" aria-label="Growth controls">
        <button id="playback" class="button primary" type="button">
          <svg id="play-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" hidden><path d="M6 4.5 15 10l-9 5.5Z" fill="currentColor"/></svg>
          <svg id="pause-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 5v10m6-10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="playback-label">Pause</span>
        </button>
        <button id="step" class="button" type="button" aria-label="Step one generation">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="m5 5 7 5-7 5V5Zm10 0v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Step
        </button>
        <button id="reset" class="button" type="button" aria-label="Reset growth">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M4 10a6 6 0 1 1 1.7 4.2M4 5v5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Reset
        </button>
        <div class="speed-control">
          <label for="speed">Speed</label>
          <input id="speed" type="range" min="1" max="8" value="3" />
          <output id="speed-value" for="speed">3 gen/s</output>
        </div>
        <div class="generation">
          <label for="timeline">Generation</label>
          <input id="timeline" type="range" min="0" max="0" value="0" />
          <output id="generation" for="timeline" aria-label="Current generation" aria-live="off">0</output>
        </div>
      </div>

      <div class="panels">
        <section class="panel rules" aria-labelledby="rules-title">
          <div class="panel-heading">
            <h2 id="rules-title">Growth rules</h2>
            <div class="rule-tools">
              <div class="preset-picker">
                <label for="preset">Preset</label>
                <select id="preset"><option value="" hidden>Custom</option></select>
              </div>
              <button id="open-workspace" class="button" type="button" aria-label="Open workspace file">Open</button>
              <input id="workspace-file" type="file" accept=".json,application/json" hidden />
            </div>
          </div>
          <div id="workspace" aria-label="Blockly workspace"></div>
          <div class="panel-footer rules-footer">
            <span id="rule-message" role="status">Add conditions from Logic to change when buds grow.</span>
            <span id="save-status" role="status"></span>
            <span id="import-status" role="status"></span>
          </div>
        </section>
        <section class="panel preview" aria-labelledby="preview-title">
          <div class="panel-heading">
            <h2 id="preview-title">Plant preview</h2>
            <span class="status" id="growth-status" data-state="running" role="status">Growing</span>
          </div>
          <div class="scene">
            <canvas id="plant" role="img" aria-label="Plant growing from a seed"></canvas>
            <div id="height-ruler" class="ruler" role="img" aria-label="Height ruler"></div>
            <button id="sun" class="sun" type="button" aria-label="Move sun" aria-describedby="sun-help" title="Drag to move the sun">
              <svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><circle cx="18" cy="18" r="6" fill="currentColor"/><path d="M18 3v4m0 22v4M3 18h4m22 0h4M7.4 7.4l2.8 2.8m15.6 15.6 2.8 2.8M7.4 28.6l2.8-2.8m15.6-15.6 2.8-2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="panel-footer plant-stats">
            <span><output id="bud-count" aria-live="off">0</output> active buds</span>
            <span><output id="segment-count" aria-live="off">0</output> segments</span>
            <span class="height-readout">Height <output id="height-value" aria-live="off">0 m</output></span>
            <span id="sun-help" class="sr-only">Drag the sun or use arrow keys.</span>
            <button id="mutate" class="button mutate" type="button" aria-expanded="false" aria-controls="mutations">
              <svg viewBox="0 0 20 20" width="17" height="17" fill="none" aria-hidden="true"><path d="M10 17V8m0 5-5-5m5 2 5-5M5 8V5m10 0v-2m0 2h3" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Mutate
            </button>
          </div>
          <section id="mutations" class="mutations" aria-labelledby="mutations-title" hidden>
            <div class="mutations-heading">
              <h3 id="mutations-title">Choose a variant</h3>
              <span id="mutation-caption" role="status"></span>
              <button id="close-mutations" class="button" type="button" aria-label="Close variants">Close</button>
            </div>
            <div id="variant-grid" class="variant-grid"></div>
          </section>
        </section>
      </div>
    </main>
    <dialog id="tree-name-dialog" class="library-dialog name-dialog" aria-labelledby="tree-name-title">
      <form id="tree-name-form">
        <h2 id="tree-name-title">Save tree</h2>
        <label for="tree-name">Tree name</label>
        <input id="tree-name" name="tree-name" type="text" maxlength="80" required autofocus />
        <p id="tree-name-error" class="library-message" role="alert"></p>
        <div class="dialog-actions">
          <button id="cancel-tree-name" class="button" type="button">Cancel</button>
          <button class="button primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>
    <dialog id="tree-library" class="library-dialog" aria-labelledby="tree-library-title">
      <div class="library-heading">
        <h2 id="tree-library-title">My trees</h2>
        <form method="dialog"><button class="button" type="submit">Close</button></form>
      </div>
      <div class="library-feedback">
        <p id="tree-library-message" class="library-message" role="status"></p>
        <button id="undo-tree-delete" class="button" type="button" hidden>Undo</button>
      </div>
      <ul id="tree-library-list" class="tree-library-list"></ul>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
